<!doctype html><!-- SPDX-License-Identifier: AGPL-3.0-or-later --><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>證件照排版與輸出</title><script src="https://cdn.tailwindcss.com"></script><!-- Uses @imgly/background-removal, licensed AGPL-3.0-or-later. Source and notices: README.md / NOTICE.md. --><script type="module">import{removeBackground}from'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm';window.removeBackground=removeBackground</script><style>input[type=range]{accent-color:#2563eb}#box{touch-action:none}#crop{pointer-events:none;user-select:none;-webkit-user-drag:none}.dots{background-image:radial-gradient(#cbd5e1 1px,transparent 1px);background-size:12px 12px}@media print{body>*:not(#print){display:none!important}#print{display:block!important}}</style></head>
<body class="min-h-screen bg-slate-100 text-slate-800"><main class="mx-auto max-w-6xl p-4 py-8 sm:p-8"><header class="mb-7 text-center"><div class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-2xl bg-blue-600 text-2xl text-white">▣</div><h1 class="text-3xl font-bold text-slate-900">證件照排版與輸出</h1><p class="mt-2 text-sm text-slate-500">上傳、裁切、去背與高解析下載。</p></header><div class="grid gap-6 lg:grid-cols-[390px_1fr]"><section class="rounded-3xl bg-white p-5 shadow-sm ring-1 ring-slate-200"><h2 class="font-bold">設定照片</h2><label class="mt-4 flex cursor-pointer flex-col items-center rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50 p-6 text-sm text-blue-600 hover:bg-blue-50">＋ 上傳人物照片 <span class="mt-1 text-xs text-slate-400">JPG、PNG、WEBP</span><input id="file" type="file" accept="image/*" class="hidden"></label><div class="mt-6 space-y-5"><fieldset><legend class="text-sm font-semibold">證件照尺寸</legend><div id="sizeChoices" class="mt-2 grid grid-cols-3 gap-2"><label class="cursor-pointer rounded-xl border-2 border-blue-500 bg-blue-50 p-2 text-center"><input class="sr-only" type="radio" name="size" value="two" checked><b class="block text-sm">2 吋</b><small>3.5 × 4.5 cm</small></label><label class="cursor-pointer rounded-xl border-2 border-slate-200 p-2 text-center"><input class="sr-only" type="radio" name="size" value="one"><b class="block text-sm">1 吋</b><small>2.8 × 3.5 cm</small></label><label class="cursor-pointer rounded-xl border-2 border-slate-200 p-2 text-center"><input class="sr-only" type="radio" name="size" value="mixed"><b class="block text-sm">混合</b><small>各 4 張</small></label></div></fieldset><fieldset><legend class="text-sm font-semibold">背景處理</legend><label id="removeCard" class="mt-2 flex cursor-pointer items-center gap-3 rounded-xl border-2 border-slate-200 p-3 text-sm font-semibold transition"><input id="remove" type="checkbox" class="h-4 w-4">去背後更換背景 <span id="wait" class="ml-auto hidden text-xs text-blue-600">去背中…</span></label><div id="bgChoices" class="mt-2 grid grid-cols-2 gap-2 opacity-40"><label class="cursor-pointer rounded-xl border-2 border-blue-500 bg-blue-50 p-2 text-center"><input class="sr-only" type="radio" name="bg" value="white" checked disabled><b class="text-sm">白色背景</b></label><label class="cursor-pointer rounded-xl border-2 border-slate-200 p-2 text-center"><input class="sr-only" type="radio" name="bg" value="blue" disabled><b class="text-sm">漸層藍背景</b></label></div><p class="mt-2 text-xs text-slate-400">未選去背時保留原圖背景；去背在瀏覽器內進行。</p></fieldset><fieldset><legend class="text-sm font-semibold">輸出紙張</legend><div id="paperChoices" class="mt-2 grid grid-cols-2 gap-2"><label class="cursor-pointer rounded-xl border-2 border-blue-500 bg-blue-50 p-3 text-center"><input class="sr-only" type="radio" name="paper" value="4x6" checked><b>4 × 6 吋</b></label><label class="cursor-pointer rounded-xl border-2 border-slate-200 p-3 text-center"><input class="sr-only" type="radio" name="paper" value="a4"><b>A4</b></label></div></fieldset><div class="flex justify-between text-sm font-semibold"><label>縮放照片</label><span id="zv" class="font-normal text-slate-400">100%</span></div><input id="zoom" type="range" min="100" max="250" value="100" class="w-full"></div><div class="mt-6"><button id="save" disabled class="w-full rounded-xl bg-blue-600 p-3 text-sm font-bold text-white disabled:bg-slate-300">下載 PNG</button></div></section><section class="rounded-3xl bg-white p-5 shadow-sm ring-1 ring-slate-200"><div class="flex justify-between"><div><h2 class="font-bold">裁切與排版預覽</h2><p class="text-xs text-slate-500">拖曳圖片調整頭像位置。</p></div><span id="count" class="hidden rounded-full bg-blue-50 px-3 py-1 text-xs font-bold text-blue-700"></span></div><div class="mt-5 grid gap-6 md:grid-cols-[280px_1fr]"><div><div id="box" class="dots relative mx-auto flex w-full max-w-[280px] cursor-move items-center justify-center overflow-hidden rounded-xl bg-slate-100" style="aspect-ratio:3.5/4.5"><img id="crop" class="absolute max-w-none"><span id="empty" class="z-10 px-6 text-center text-sm text-slate-400">請上傳照片</span><i class="pointer-events-none absolute inset-0 rounded-xl ring-2 ring-inset ring-blue-500"></i></div><p class="mt-3 text-center text-xs text-slate-400">拖曳移動，滑桿縮放</p></div><div class="dots rounded-xl border p-3"><canvas id="preview" class="block w-full bg-white shadow"></canvas></div></div></section></div></main>
<script>
const D=300,C=D/2.54,S={two:{w:3.5*C,h:4.5*C,n:'2吋'},one:{w:2.8*C,h:3.5*C,n:'1吋'}},P={'4x6':{w:1800,h:1200},a4:{w:2480,h:3508}},q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];let orig,originalFile,img,cut,scale=1,pos={x:0,y:0},drag,start;const get=n=>q(`input[name=${n}]:checked`).value,sz=()=>S[get('size')==='one'?'one':'two'];
function styles(id){qa('#'+id+'Choices label').forEach(x=>{let on=x.querySelector('input').checked;x.classList.toggle('border-blue-500',on);x.classList.toggle('bg-blue-50',on);x.classList.toggle('border-slate-200',!on)})}function apply(){if(!img)return;let b=q('#box').getBoundingClientRect(),k=scale*q('#zoom').value/100,w=img.naturalWidth*k,h=img.naturalHeight*k;q('#crop').style.cssText=`width:${w}px;height:${h}px;left:calc(50% + ${pos.x}px - ${w/2}px);top:calc(50% + ${pos.y}px - ${h/2}px)`;q('#zv').textContent=q('#zoom').value+'%';render()}function fit(){if(!img)return;let b=q('#box').getBoundingClientRect();scale=Math.max(b.width/img.naturalWidth,b.height/img.naturalHeight);pos={x:0,y:0};apply()}
function layout(){let p=P[get('paper')],m=42,g=16,t=get('size');if(t!=='mixed'){let s=S[t],co=Math.floor((p.w-2*m+g)/(s.w+g)),ro=Math.floor((p.h-2*m+g)/(s.h+g)),uw=co*s.w+(co-1)*g,uh=ro*s.h+(ro-1)*g;return{p,a:Array.from({length:co*ro},(_,i)=>({s,x:(p.w-uw)/2+i%co*(s.w+g),y:(p.h-uh)/2+Math.floor(i/co)*(s.h+g)})),txt:`${co*ro} 張 ${s.n}`}}let a=[],x;if(get('paper')==='4x6'){x=(p.w-(4*S.two.w+3*g))/2;for(let i=0;i<4;i++)a.push({s:S.two,x:x+i*(S.two.w+g),y:m});x=(p.w-(4*S.one.w+3*g))/2;for(let i=0;i<4;i++)a.push({s:S.one,x:x+i*(S.one.w+g),y:m+S.two.h+g})}else{x=(p.w-(2*S.two.w+g))/2;for(let i=0;i<4;i++)a.push({s:S.two,x:x+i%2*(S.two.w+g),y:m+Math.floor(i/2)*(S.two.h+g)});x=(p.w-(4*S.one.w+3*g))/2;for(let i=0;i<4;i++)a.push({s:S.one,x:x+i*(S.one.w+g),y:m+2*S.two.h+2*g})}return{p,a,txt:'4 張 2吋 + 4 張 1吋'}}
function blueGradient(c,x,y,w,h){let g=c.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#3A9DF8');g.addColorStop(.4,'#62B4FC');g.addColorStop(.7,'#8ECEFF');g.addColorStop(1,'#C2E5FF');c.fillStyle=g;c.fillRect(x,y,w,h)}function draw(c,x,y,s){let b=q('#box').getBoundingClientRect(),k=scale*q('#zoom').value/100,r=s.w/s.h,ch=b.width/k/r,cw=ch*r,sx=img.naturalWidth/2-cw/2-pos.x/k,sy=img.naturalHeight/2-ch/2-pos.y/k;if(q('#remove').checked){if(get('bg')==='white'){c.fillStyle='#fff';c.fillRect(x,y,s.w,s.h)}else blueGradient(c,x,y,s.w,s.h)}c.drawImage(img,sx,sy,cw,ch,x,y,s.w,s.h)}function render(){let l=layout(),r=Math.min(700/l.p.w,430/l.p.h),c=q('#preview');c.width=l.p.w*r;c.height=l.p.h*r;let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);if(img)l.a.forEach(i=>{x.save();x.scale(r,r);draw(x,i.x,i.y,i.s);x.restore()});q('#count').textContent=l.txt;q('#count').classList.toggle('hidden',!img)}function out(){let l=layout(),c=document.createElement('canvas');c.width=l.p.w;c.height=l.p.h;let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);l.a.forEach(i=>draw(x,i.x,i.y,i.s));return c}
function use(i){img=i;q('#crop').src=i.src;q('#empty').classList.add('hidden');requestAnimationFrame(fit);q('#save').disabled=false}function reflow(){if(!img)return;let b=q('#box').getBoundingClientRect(),minimum=Math.max(b.width/img.naturalWidth,b.height/img.naturalHeight);scale=Math.max(scale,minimum);apply()}q('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;originalFile=f;orig=new Image;orig.onload=()=>{cut=null;q('#zoom').value=100;use(orig)};orig.src=URL.createObjectURL(f)};q('#remove').onchange=async e=>{let selected=e.target.checked;q('#removeCard').classList.toggle('border-blue-500',selected);q('#removeCard').classList.toggle('bg-blue-50',selected);q('#removeCard').classList.toggle('border-slate-200',!selected);q('#bgChoices').classList.toggle('opacity-40',!selected);qa('#bgChoices input').forEach(x=>x.disabled=!selected);if(!selected){if(orig)use(orig);return}if(cut){use(cut);return}if(!originalFile||!window.removeBackground){alert('去背模組載入中，請稍候重試。');e.target.checked=false;q('#removeCard').classList.remove('border-blue-500','bg-blue-50');q('#removeCard').classList.add('border-slate-200');return}try{q('#wait').classList.remove('hidden');let u=URL.createObjectURL(await window.removeBackground(originalFile));cut=new Image;cut.onload=()=>{use(cut);URL.revokeObjectURL(u)};cut.onerror=()=>{URL.revokeObjectURL(u);throw new Error('去背結果無法載入')};cut.src=u}catch(e){console.error(e);alert('去背失敗，請確認網路連線後再試。');e.target.checked=false;q('#removeCard').classList.remove('border-blue-500','bg-blue-50');q('#removeCard').classList.add('border-slate-200');q('#bgChoices').classList.add('opacity-40');qa('#bgChoices input').forEach(x=>x.disabled=true)}finally{q('#wait').classList.add('hidden')}};
qa('input[name=size]').forEach(e=>e.onchange=()=>{styles('size');let s=sz();q('#box').style.aspectRatio=s.w+'/'+s.h;requestAnimationFrame(fit)});qa('input[name=paper]').forEach(e=>e.onchange=()=>{styles('paper');render()});qa('input[name=bg]').forEach(e=>e.onchange=()=>{styles('bg');render()});q('#zoom').oninput=apply;q('#box').onpointerdown=e=>{if(!img)return;e.preventDefault();drag=true;start={x:e.clientX,y:e.clientY,px:pos.x,py:pos.y};q('#box').setPointerCapture(e.pointerId)};q('#box').onpointermove=e=>{if(drag){e.preventDefault();pos={x:start.px+e.clientX-start.x,y:start.py+e.clientY-start.y};apply()}};q('#box').onpointerup=()=>drag=false;q('#box').onpointercancel=()=>drag=false;q('#save').onclick=()=>{let canvas=out();canvas.toBlob(blob=>{if(!blob){alert('無法產生 PNG，請再試一次。');return}let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='證件照.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')};addEventListener('resize',reflow);render();
</script></body></html>
